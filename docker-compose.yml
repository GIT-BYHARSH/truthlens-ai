services:
  db:
    image: postgres:16-alpine
    container_name: truthlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: truthlens
      POSTGRES_DB: truthlens
    ports:
      - "5432:5432"
    volumes:
      - truthlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens -d truthlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truthlens_pgdata:
